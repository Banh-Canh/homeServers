apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/infrastructure/cilium
  prune: false
  patches:
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cilium
        spec:
          values:
            k8sServiceHost: "10.207.7.2"
            k8sServicePort: 6443
      target:
        kind: HelmRelease
        name: cilium
    - patch: |
        apiVersion: "cilium.io/v2alpha1"
        kind: CiliumL2AnnouncementPolicy
        metadata:
          name: internal
        spec:
          interfaces:
            - "enp3s0"
      target:
        kind: CiliumL2AnnouncementPolicy
        name: internal
    - patch: |
        apiVersion: cilium.io/v2
        kind: CiliumLoadBalancerIPPool
        metadata:
          name: internal
        spec:
          allowFirstLastIPs: "Yes"
          blocks:
            - cidr: "10.208.0.0/16"
          disabled: false
      target:
        kind: CiliumLoadBalancerIPPool
        name: internal
