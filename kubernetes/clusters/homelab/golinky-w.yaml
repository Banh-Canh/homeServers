apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: golinky-w
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/infrastructure/golinky
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: golinky-w
  patches:
    - patch: |
        apiVersion: v1
        kind: Service
        metadata:
          name: golinky
          namespace: golinky-w
          annotations:
            tailscale.com/hostname: w
      target:
        kind: Service
        name: golinky
