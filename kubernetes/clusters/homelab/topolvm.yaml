apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: topolvm
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/infrastructure/topolvm
  prune: true
  wait: true
  timeout: 5m
  patches:
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: topolvm
        spec:
          values:
            lvmd:
              deviceClasses:
                - name: default
                  volume-group: topolvm-vg
                  default: true
                  spare-gb: 10
      target:
        kind: HelmRelease
        name: topolvm
