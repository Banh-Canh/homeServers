apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: topolvm
spec:
  interval: 5m
  chart:
    spec:
      chart: topolvm
      version: "16.0.1"
      sourceRef:
        kind: HelmRepository
        name: topolvm
        namespace: topolvm-system
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: topolvm-values
