apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovumcy
  labels:
    app.kubernetes.io/name: ovumcy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ovumcy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ovumcy
    spec:
      containers:
        - name: ovumcy
          image: ghcr.io/ovumcy/ovumcy-web:v0.9.2
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: UTC
            - name: DEFAULT_LANGUAGE
              value: en
            - name: DB_DRIVER
              value: sqlite
            - name: DB_PATH
              value: /app/data/ovumcy.db
            - name: COOKIE_SECURE
              value: "false"
            - name: OIDC_ENABLED
              value: "false"
            - name: OIDC_LOGIN_MODE
              value: hybrid
            - name: OIDC_AUTO_PROVISION
              value: "false"
            - name: OIDC_LOGOUT_MODE
              value: local
            - name: RATE_LIMIT_LOGIN_MAX
              value: "8"
            - name: RATE_LIMIT_LOGIN_WINDOW
              value: 15m
            - name: RATE_LIMIT_FORGOT_PASSWORD_MAX
              value: "8"
            - name: RATE_LIMIT_FORGOT_PASSWORD_WINDOW
              value: 1h
            - name: RATE_LIMIT_API_MAX
              value: "300"
            - name: RATE_LIMIT_API_WINDOW
              value: 1m
            - name: TRUST_PROXY_ENABLED
              value: "false"
            - name: PROXY_HEADER
              value: X-Forwarded-For
            - name: TRUSTED_PROXIES
              value: "127.0.0.1,::1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ovumcy-data
        - name: tmp
          emptyDir: {}
